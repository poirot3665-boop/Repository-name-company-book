<!DOCTYPE html>
<!-- HTML5で作成することを宣言 -->

<html lang="ja">
<!-- 日本語のページ -->

<head>

    <!-- 文字コード（日本語対応） -->
    <meta charset="UTF-8">
    <meta name="keywords" content="S-system、函館、清掃、ハウスクリーニング、二等無人航空機操縦士、ドローン,drone">
    <!-- 【スマホ対応】画面幅に合わせて表示を調整し、iPhoneのノッチ（画面上部の切り欠き）部分まで背景を広げます -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- ブラウザのタイトル -->
    <title>TV Test Pattern</title>

    <!-- CSSファイルを読み込む -->
    <link rel="stylesheet" href="TV.css" media="all">
    <link rel="icon" href="favicon.ico">
</head>

<body>

    <!--
        test
        画面全体を囲む箱（コンテナ）
    -->
    <div class="test">

        <!--
            上段のカラーバー
            黄色～黒色まで7色並べる
        -->
        <div class="top">

            <!-- 黄色 -->
            <div class="yellow"></div>

            <!-- シアン（水色） -->
            <div class="cyan"></div>

            <!-- 緑 -->
            <div class="green"></div>

            <!-- マゼンタ（紫ピンク） -->
            <div class="magenta"></div>

            <!-- 赤 -->
            <div class="red"></div>

            <!-- 青 -->
            <div class="blue"></div>

            <!-- 黒 -->
            <div class="black"></div>

        </div>

        <!--
            下段の色ブロック
        -->
        <div class="bottom">

            <!-- 紺 -->
            <div class="navy"></div>

            <!-- 白 -->
            <div class="white"></div>

            <!-- 紫 -->
            <div class="purple"></div>

            <!-- 黒 -->
            <div class="black"></div>

            <!-- シアン -->
            <div class="cyan"></div>

            <!-- 黒 -->
            <div class="black"></div>

            <!-- 白 -->
            <div class="white"></div>

        </div>

    </div>

</body>

</html>
