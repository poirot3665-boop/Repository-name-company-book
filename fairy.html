<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
    <meta name="keywords" content="S-system、函館、清掃、ハウスクリーニング、二等無人航空機操縦士、ドローン,drone, ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAIRY TAIL Request Board</title>
  <link rel="stylesheet" href="fairy.css" media="all">
    <link rel="icon" href="favicon.ico">
</head>

<body>
  <div class="container">
    <div class="board">
      <!-- 看板 -->
      <div class="header">
        REQUEST BOARD
      </div>

      <!-- 依頼書（紙） -->
       <div class="paper paper1" data-title="ハウスクリーニング：空室" data-subtitle="1R〜" data-price="15,000円〜" 
      data-detail="【作業内容】\1R・15,000円（車輛1台+作業員2名）～\1DK・20,000円（車輛1台+作業員2名）～
        \2DK・25,000円（車輛1台+作業員3名）～\3DK・30,000円（車輛1台+作業員3名）～\【所要時間】目安として約3〜5時間
        \【注意事項】空室状態での作業となります。家具などは事前に移動をお願いします。
        また、汚れの状況により料金・作業時間が変動します。詳細は無料にて現地調査・お見積もり対応いたします。">
        <h3>ハウスクリーニング：空室</h3>
        <p><strong>1R～</strong></p>
        <p class="reward">作業料金：15,000 円〜</p>
      </div>

      <div class="paper paper2" data-title="ハウスクリーニング：在室" data-subtitle="1R〜" data-price="16,000円〜" 
      data-detail="【作業内容】\1R・16,000円（車輛1台+作業員2名）～\1DK・21,000円（車輛1台+作業員2名）～
        \2DK・26,000円（車輛1台+作業員3名）～\3DK・31,000円（車輛1台+作業員3名）～\【所要時間】目安として約3.5〜5.5時間
        \【注意事項】在室状態での作業となります。お客様にご迷惑をお掛けする場合があるかも知れませんが、細心の注意を払い作業をいたします。
        また、汚れの状況により料金・作業時間が変動します。詳細は無料にて現地調査・お見積もり対応いたします。">
        <h3>ハウスクリーニング：在室</h3>
        <p><strong>1R～</strong></p>
        <p class="reward">作業料金：16,000 円～</p>
      </div>

      <div class="paper paper3" data-title="水回り清掃" data-subtitle="キッチン、換気扇、洗面所、トイレ、浴室" data-price="6,000円〜" 
      data-detail="【作業内容】\キッチン・12,000円（車輛1台+作業員2名）～\換気扇・9,000円（車輛1台+作業員1名）～
        \洗面所・6,500円（車輛1台+作業員1名）～\トイレ・6,000円（車輛1台+作業員1名）～\浴室・11,000円（車輛1台+作業員1名）\【所要時間】1箇所目安として約1〜2時間
        \【注意事項】汚れの状況により料金・作業時間が変動します。詳細は無料にて現地調査・お見積もり対応いたします。">
        <h3><strong>水回り清掃</strong></h3>
        <p><strong>キッチン、換気扇、洗面所、トイレ、浴室</strong></p>
        <p class="reward">作業料金：6,000 円～</p>
      </div>

      <div class="paper paper4" data-title="新築・竣工美装" data-subtitle="平米単価" data-price="1㎡料金：1,000 円～" 
      data-detail="【作業内容】\窓ガラス・サッシの清掃（内側・外側）\建具（ドア・クローゼット）の拭き上げ掃除
        \キッチン・浴室・トイレなどの水回り最終仕上げ\細かなゴミ・梱包材の回収\ワックス掛けなどなど\【所要時間】－時間・－日数
        \【注意事項】物件の広さ・階数・汚れの状況により料金などが変動する場合があります。無料にて現地調査・お見積もり対応いたします。">
        <h3>新築・竣工美装</h3>
        <p><strong>平米単価</strong></p>
        <p class="reward">1㎡料金：1,000 円～</p>
      </div>

      <div class="paper paper5" data-title="リフォーム後清掃" data-subtitle="1R～" data-price="作業料金：18,000 円～" 
      data-detail="【作業内容】\1R・18,000円（車輛1台+作業員2名）～\1DK・23,000円（車輛1台+作業員2名）～
        \2DK・28,000円（車輛1台+作業員3名）～\3DK・33,000円（車輛1台+作業員3名）～\【所要時間】目安として約3〜5時間
        \【注意事項】物件の広さ・階数・汚れの状況により料金などが変動する場合があります。無料にて現地調査・お見積もり対応いたします。">
        <h3>リフォーム後清掃</h3>
        <p><strong>1R～</strong></p>
        <p class="reward">作業料金：18,000 円～</p>
      </div>

      <div class="paper paper6" data-title=ほか、各種ご要望・お困り事があれば…" data-subtitle="ご依頼の相談など" data-price="作業料金：18,000 円～" 
      data-detail="【作業内容】\ご依頼の相談お見積りなど\【所要時間】目安として約30分〜
        \【注意事項】物件の広さ・階数・汚れの状況により料金などが変動する場合があります。無料現地調査・お見積もり対応いたします。">
        <h3>ほか、各種ご要望・お困り事があれば…</h3>
        <p><strong>ご依頼の相談など</strong></p>
        <p class="reward">現地調査・お見積もり：無料～</p>
      </div>
