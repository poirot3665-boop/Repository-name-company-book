<!DOCTYPE html>
<html lang="ja">

<head>
  <!-- 【基本設定】文字化けを防ぎ、検索エンジンに函館の清掃・ドローン事業であることを伝えます -->
  <meta charset="UTF-8">
  <meta name="keywords" content="S-system、函館、清掃、ハウスクリーニング、二等無人航空機操縦士、ドローン,drone">
  
  <!-- 【スマホ対応】画面幅に合わせて表示を調整し、iPhoneのノッチ（画面上部の切り欠き）部分まで背景を広げます -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>S-SYSTEM | Main</title>

  <!-- 【外部ファイル】デザインを決めるCSSファイルを読み込みます -->
  <link href="index.css" rel="stylesheet" media="all">
  <link rel="icon" href="favicon.ico">
</head>

<!-- 
  【重要】bodyタグに「main-page」というクラスを付けます。
  これにより、CSSで書いた「画面中央に寄せる設定」がこのページ全体に適用されます。
-->
<body class="main-page">

  <!-- 
    【メインコンテナ】画面中央に表示される白いカード型の箱です。
    ここに会社のロゴやメニューをまとめて入れます。
  -->
  <section class="main-container">
    
    <!-- ロゴ部分：「S」だけ大きくするデザインを継承しています -->
    <div class="main-logo"><span class="main-logo-first">S</span>-SYSTEM</div>
    
    <!-- 見出し：CONTENTSの下に少し余白を設けています -->
    <h2 style="margin-bottom: 25px;">CONTENTS</h2>

    <!-- 【メニューリスト】各事業へのリンクボタン（カード）を並べる親要素です -->
    <div class="menu-list">

      <!-- 1. 会社概要カード -->
      <a href="about.html" class="menu-card">
        <!-- <a href="/Repository-name-company-book/about/about.html"></a> -->
        <div class="menu-icon">🏢</div>
        <div class="menu-info">
          <h3>Company Profile</h3>
          <p>会社概要・代表挨拶・所在地</p>
        </div>
      </a>

      <!-- 2. 清掃事業カード -->
      <a href="fairy.html" class="menu-card">
        <div class="menu-icon">🧹</div>
        <div class="menu-info">
          <h3>Cleaning Service</h3>
          <p>高所・足場作業、ハウスクリーニング</p>
        </div>
      </a>

      <!-- 3. ドローン事業カード -->
      <a href="drone.html" class="menu-card">
        <div class="menu-icon">🛸</div>
        <div class="menu-info">
          <h3>Drone Business</h3>
          <p>空中鳥獣動態調査、建物診断、空撮</p>
        </div>
      </a>

    </div>

    <!-- 【お問い合わせ】メールソフトが立ち上がる特別なボタンです -->
    <a href="mailto:S-system2025@outlook.jp" class="contact-button">お問い合わせメール</a>
  
  </section>

  <!-- 
    【TOPボタン】
    ここを main-container の「外」に置くのがポイントです。
    CSSの position: fixed; によって、箱の位置に関係なく画面の右下に固定されます。
  -->
  <div class="pagetop">
    <a href="#">TOP</a>
  </div>

</body>
</html>
